[SERVICE]
    Flush          1
    Daemon         Off
    Log_Level      info
    Parsers_File   parsers.conf
    Parsers_File   parse_custom.conf

[INPUT]
    Name               syslog
    Mode               udp
    Listen             0.0.0.0
    Port               1517
    Parser             syslog-passthrough
    Tag                syslog
    Source_Address_Key hostIp

[INPUT]
    Name               syslog
    Mode               tcp
    Listen             0.0.0.0
    Port               1518
    Parser             syslog-passthrough
    Tag                syslog
    Source_Address_Key hostIp

[FILTER]
    Name    lua
    Match   syslog
    script  enrich_syslog.lua
    call    enrich

[OUTPUT]
    Name   stdout
    Match  *

[OUTPUT]
    Name   file
    Match  *
    Path   data\
    File   syslog_parsed.log
    Format Plain

[OUTPUT]
    Name              es
    Match             *
    Host              127.0.0.1
    Port              9200
    Index             ScribblerCurrent
    Suppress_Type_Name On

# Forwarder -- port of the Logstash `output { syslog { ... } }` block.
# Field mapping mirrors the Logstash options one-for-one:
#   priority    => syslog_pri            -> facility_key + severity_key
#   sourcehost  => syslog_host           -> syslog_hostname_key
#   appname     => syslog_program        -> syslog_appname_key
#   procid      => syslog_process_id     -> syslog_procid_key
#   msgid       => syslog_message_id     -> syslog_msgid_key
#   codec plain "%{message}"             -> syslog_message_key
#   syslogtime  => syslog_timestamp      -> carried by the event time
#                                          (FORWARD_ORIGINAL_TIME in the Lua)
# tcp_framing => non-transparent-framing is what out_syslog does over TCP
# (LF-terminated frames), so there is nothing to configure for it.
[OUTPUT]
    Name                 syslog
    Match                *
    Host                 10.10.1.92
    Port                 1514
    Mode                 tcp
    syslog_format        rfc5424
    syslog_maxsize       8192
    syslog_facility_key  syslog_facility_code
    syslog_severity_key  syslog_severity_code
    syslog_hostname_key  syslog_host
    syslog_appname_key   syslog_program
    syslog_procid_key    syslog_process_id
    syslog_msgid_key     syslog_message_id
    syslog_message_key   message
    Retry_Limit          no_limits
    net.keepalive        on

[SERVICE]
    Flush          1
    Daemon         Off
    Log_Level      info
    Parsers_File   parsers.conf
    Parsers_File   parse_custom.conf

[INPUT]
    Name               syslog
    Mode               udp
    Listen             0.0.0.0
    Port               1517
    Parser             syslog-passthrough
    Tag                syslog
    Source_Address_Key hostIp

[INPUT]
    Name               syslog
    Mode               tcp
    Listen             0.0.0.0
    Port               1518
    Parser             syslog-passthrough
    Tag                syslog
    Source_Address_Key hostIp
    # TCP framing (RFC 6587). Valid values are ONLY `newline` and
    # `octet_counting` -- there is no `raw`, and no auto-detect mode.
    #
    # `newline` accepts BOTH framings on this single port: octet-counted
    # frames arrive with the count as leading text, and syslog-passthrough
    # strips it. This mirrors the Logstash line-based input being replaced.
    #
    # Precondition: octet-counting senders must also terminate with LF.
    # A strict RFC 6587 sender that omits it will stall here -- no records,
    # no error -- until Buffer_Max_Size. Such senders need their own port
    # with `Format octet_counting` (see the commented block below).
    Format             newline

[OUTPUT]
    Name   file
    # `syslog` only: the forwarded copy (tag `syslog.forward`) carries the
    # same record plus `rawforward`, so `*` would log every message twice.
    Match  syslog
    Path   data\
    File   raw_messages.log
    Format Plain

# Strict octet-counting senders (no LF between frames) go here. Same Tag, so
# the Lua filter and outputs treat both ports identically. Uncomment if a
# sender ever goes silent against 1518.
#[INPUT]
#    Name               syslog
#    Mode               tcp
#    Listen             0.0.0.0
#    Port               1519
#    Parser             syslog-passthrough
#    Tag                syslog
#    Source_Address_Key hostIp
#    Format             octet_counting

[FILTER]
    Name    lua
    Match   syslog
    script  enrich_syslog.lua
    call    enrich

# The Lua filter builds the complete forwarded frame into `rawforward`, and
# that field must reach ONLY the tcp OUTPUT -- never the stored document.
# rewrite_tag emits a copy of every record under `syslog.forward` (keep=true
# leaves the original on `syslog` for stdout/ES), and record_modifier then
# strips the field from the original. Match `syslog` is an exact tag match, so
# neither filter touches the forwarded copy.
[FILTER]
    Name          rewrite_tag
    Match         syslog
    Rule          $rawforward .* syslog.forward true
    Emitter_Name  syslog_forward_emitter

[FILTER]
    Name       record_modifier
    Match      syslog
    Remove_key rawforward

[OUTPUT]
    Name   stdout
    Match  syslog

#[OUTPUT]
#    Name   file
#    Match  *
#    Path   data\
#    File   syslog_parsed.log
#    Format Plain

[OUTPUT]
    Name              es
    Match             syslog
    Host              127.0.0.1
    Port              9200
    Index             ScribblerCurrent
    Suppress_Type_Name On


# Forwarder -- port of the Logstash `output { syslog { ... } }` block:
#
#   codec => plain { format => "%{message}" }   -> MESSAGE
#   rfc   => "rfc5424"                          -> "<PRI>1 TS HOST APP PROCID MSGID MSG"
#   priority   => %{syslog_pri}                 -> PRI
#   syslogtime => %{syslog_timestamp}           -> TS (UTC, 6 fractional digits)
#   sourcehost => %{syslog_host}                -> HOST
#   appname    => %{syslog_program}             -> APP
#   procid     => %{syslog_process_id}          -> PROCID
#   msgid      => %{syslog_message_id}          -> MSGID
#   tcp_framing => non-transparent-framing      -> LF-terminated frame
#   ssl_verify is inert under `protocol => tcp` (it only applies to ssl-tcp),
#   so this is a plain TCP connection, as before.
#
# NOTE: this is deliberately NOT the `syslog` OUTPUT plugin. In rfc5424 mode
# out_syslog always writes the STRUCTURED-DATA NILVALUE ("- ") and a UTF-8 BOM
# in front of MSG -- both RFC 5424 conformant, both absent from Logstash's
# frame, and neither configurable. Captured from out_syslog for comparison:
#
#   <165>1 ...Z hostname webapp 9981 evt-777 - <BOM>[meta@1 env="prod"] payload
#                                            ^^^ ^^^^^ not emitted by Logstash
#
# `tcp` with raw_message_key sends the field's bytes verbatim and terminates
# the frame with LF, which is exactly non-transparent-framing.
[OUTPUT]
    Name             tcp
    Match            syslog.forward
    Host             10.10.1.92
    Port             1514
    raw_message_key  $rawforward
    Retry_Limit      no_limits
    net.keepalive    on

[PARSER]
    # Passthrough: capture the PRI value and hand the entire remaining
    # line to Lua as "message". Format detection + structured parsing
    # (RFC5424 vs RFC3164) happen in enrich_syslog.lua.
    #
    # The leading (?:[0-9]{1,5} (?=\<))? strips an RFC6587 octet-count frame
    # header ("213 <14>1 ..."). This is what lets ONE TCP port accept both
    # non-transparent and octet-counted senders, matching the Logstash
    # line-based inputs this config replaces. The (?=\<) lookahead is load
    # bearing: without it a message body that merely starts with digits
    # ("<13>42 apples counted") would lose its first token.
    Name    syslog-passthrough
    Format  regex
    Regex   ^(?:[0-9]{1,5} (?=\<))?(?:\<(?<pri>[0-9]{1,5})\>)?(?<message>.*)$

# NOTE: framing cannot be handled by a `parser` FILTER. Framing decides where
# one message ends and the next begins, and the input has already made that
# decision before any filter runs. A filter can only strip a count prefix off
# an already-split record -- which the regex above does in one pass. Detection
# parsers (detect_octet_counting / detect_non_transparent) were removed here
# because they duplicated that and could not do the part that matters.
